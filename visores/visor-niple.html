const stl = new DataView(bytes.buffer);
const faces = [];
function vector(offset) {
  return [0, 4, 8].map(delta => stl.getFloat32(offset + delta, true));
}
for (let offset = 84; offset < bytes.length; offset += 50) {
  const points = [12, 24, 36].map(delta => vector(offset + delta));
  const y = points.reduce((sum, point) => sum + point[1], 0) / 3;
  const piece = pieces.reduce((best, row, index) =>
    Math.abs(row[0] - y) < Math.abs(pieces[best][0] - y) ? index : best, 0);
  faces.push({points, normal: vector(offset), piece});
}

const canvas = document.querySelector('canvas');
const ctx = canvas.getContext('2d');
const select = document.querySelector('select');
const label = document.querySelector('output');
pieces.forEach(([, text], index) => select.add(new Option(text, index)));
let yaw = -1.33, pitch = .47, zoom = 1, selected = -1, visible = [], drag;

function draw() {
  const {width, height} = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(width * dpr);
  canvas.height = Math.round(height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const scale = Math.min(width * .81, height * 1.12) / 229.45863278677723 * zoom;
  const cy = Math.cos(yaw), sy = Math.sin(yaw);
  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  function rotate([x, y, z]) {
    const across = x * cy - y * sy;
    const depth = x * sy + y * cy;
    return [across, z * cp - depth * sp, depth * cp + z * sp];
  }
  visible = faces.map(({points, normal, piece}) => {
    const vertices = points.map(([x, y, z]) => rotate([x - (2963.3017578125), y - (1740.2987670898438), z - (30.16500163823366)]));
    const screen = vertices.map(([x, y]) => [width / 2 + x * scale, height / 2 - y * scale]);
    const path = new Path2D();
    path.moveTo(...screen[0]);
    path.lineTo(...screen[1]);
    path.lineTo(...screen[2]);
    path.closePath();
    const [nx, ny, nz] = rotate(normal);
    const light = Math.max(0, -.32 * nx + .48 * ny + .81 * nz);
    return {path, piece, light, depth: vertices.reduce((sum, vertex) => sum + vertex[2], 0)};
  }).sort((a, b) => a.depth - b.depth);
  for (const {path, piece, light} of visible) {
    ctx.fillStyle = 'hsl(' + (piece === selected ? '28 86%' : '210 60%') + ' ' + (28 + 36 * light) + '%)';
    ctx.fill(path);
  }
}

function choose(piece) {
  selected = piece;
  select.value = String(piece);
  label.textContent = pieces[piece]?.[1] ?? '';
  draw();
}
function changeZoom(factor) {
  zoom = Math.max(.55, Math.min(6, zoom * factor));
  draw();
}
select.onchange = () => choose(Number(select.value));
canvas.onpointerdown = event => {
  canvas.setPointerCapture(event.pointerId);
  drag = {x: event.clientX, y: event.clientY, moved: false};
};
canvas.onpointermove = event => {
  if (!drag) return;
  const dx = event.clientX - drag.x, dy = event.clientY - drag.y;
  if (!drag.moved && Math.hypot(dx, dy) < 4) return;
  drag = {x: event.clientX, y: event.clientY, moved: true};
  yaw += dx * .009;
  pitch = Math.max(-1.5, Math.min(1.5, pitch + dy * .009));
  draw();
};
canvas.onpointerup = event => {
  if (drag && !drag.moved) {
    const rect = canvas.getBoundingClientRect();
    const x = (event.clientX - rect.left) * (window.devicePixelRatio || 1);
    const y = (event.clientY - rect.top) * (window.devicePixelRatio || 1);
    const face = visible.findLast(item => ctx.isPointInPath(item.path, x, y));
    choose(face?.piece ?? -1);
  }
  drag = null;
};
canvas.onpointercancel = () => { drag = null; };
canvas.addEventListener('wheel', event => {
  event.preventDefault();
  changeZoom(Math.exp(-event.deltaY * .001));
}, {passive: false});
document.querySelector('#in').onclick = () => changeZoom(1.25);
document.querySelector('#out').onclick = () => changeZoom(.8);
document.querySelector('#reset').onclick = () => { yaw = -1.33; pitch = .47; zoom = 1; draw(); };
new ResizeObserver(draw).observe(canvas);
</script>
